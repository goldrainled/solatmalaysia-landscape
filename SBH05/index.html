</div>

<script>
  window.SELECTED_ZONE = "SBH05";
</script>

    <!-- This loads the UPDATED main.js with Jawi support -->
<script src="../main.js"></script>

    <!-- ===================== AZAN 5-WAKTU + FRIDAY AZAN 1 ===================== -->
<script>
(function(){

  // ===== CONFIGURATION =====
  const zone = "SBH05"; // Your prayer zone

  // MP3 URLs
  const URL_SUBUH  = "https://raw.githubusercontent.com/goldrainled/solatmalaysia/main/azan/azan_subuh.mp3";
  const URL_NORMAL = "https://raw.githubusercontent.com/goldrainled/solatmalaysia/main/azan/azan_normal.mp3";

  // Azan used per prayer
  const AUDIO_URLS = {
    subuh: URL_SUBUH,   // Special Fajr Azan (with "As-salatu khayrun minan naum")
    zohor: URL_NORMAL,
    asar: URL_NORMAL,
    maghrib: URL_NORMAL,
    isyak: URL_NORMAL
  };

  // Friday Azan 1 (30 minutes earlier) uses the normal Azan
  const FRIDAY_AZAN1_URL = URL_NORMAL;

  // ===== INTERNAL VARIABLES =====
  let prayTimes = {};
  let playedToday = {};
  let today = getDateString();
  let audioMap = {};

  // Preload audio files
  function preloadAudio(key, url){
    const a = new Audio(url);
    a.preload = "auto";
    audioMap[key] = a;
  }

  preloadAudio("subuh", URL_SUBUH);
  preloadAudio("normal", URL_NORMAL);
  preloadAudio("fri1", FRIDAY_AZAN1_URL);

  // Return YYYY-MM-DD
  function getDateString(d = new Date()){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  // Load today's prayer times from e-solat API
  async function loadPrayerTimes(){
    try{
      const url = `https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&period=today&zone=${zone}`;
      const res = await fetch(url);
      const json = await res.json();
      const p = json.prayerTime[0];

      prayTimes = {
        subuh : p.subuh,
        syuruk: p.syuruk,   // Not used for audio
        zohor : p.zohor,
        asar  : p.asr,
        maghrib: p.maghrib,
        isyak : p.isyak
      };

      // Reset daily status when date changes
      const nowDay = getDateString();
      if (nowDay !== today){
        today = nowDay;
        playedToday = {};
      }

      console.log("Prayer times loaded:", prayTimes);

    } catch(e){
      console.error("API error:", e);
    }
  }

  // Play a selected audio
  async function playAudio(key){
    try{
      await audioMap[key].play();
      console.log("Played:", key);
    } catch (e){
      console.error("Play failed:", key, e);
    }
  }

  // Returns HH:MM:SS minus X minutes
  function minusMinutes(hhmmss, min){
    let [h,m,s] = hhmmss.split(":").map(Number);
    let total = h*3600 + m*60 + s - min*60;
    if (total < 0) total += 24*3600;

    const H = String(Math.floor(total/3600)).padStart(2,"0");
    const M = String(Math.floor((total%3600)/60)).padStart(2,"0");
    const S = String(total%60).padStart(2,"0");

    return `${H}:${M}:${S}`;
  }

  // Called every second to check whether it's Azan time
  function tick(){

    if (!prayTimes.zohor) return; // API not loaded yet

    const now = new Date();
    const hh = String(now.getHours()).padStart(2,"0");
    const mm = String(now.getMinutes()).padStart(2,"0");
    const ss = String(now.getSeconds()).padStart(2,"0");
    const current = `${hh}:${mm}:${ss}`;

    const day = now.getDay(); // Friday = 5

    // -------------------------
    // SUBUH (special Azan)
    // -------------------------
    if (!playedToday.subuh && current === prayTimes.subuh){
      playedToday.subuh = true;
      playAudio("subuh");
    }

    // -------------------------
    // SYURUK â€?no audio
    // -------------------------

    // -------------------------
    // ZOHOR (Monâ€“Thu)
    // -------------------------
    if (day !== 5){ // Not Friday
      if (!playedToday.zohor && current === prayTimes.zohor){
        playedToday.zohor = true;
        playAudio("normal");
      }
    }

    // -------------------------
    // FRIDAY â€?Jumaat Dual Azan Mode
    // -------------------------
    if (day === 5){

      // Calculate Friday Azan 1 (30 minutes earlier)
      const fridayA1Time = minusMinutes(prayTimes.zohor, 30);

      // Friday Azan 1
      if (!playedToday.fri1 && current === fridayA1Time){
        playedToday.fri1 = true;
        console.log("Friday Azan 1 (30 minutes earlier)");
        playAudio("fri1");
      }

      // Friday Azan 2 (official Zohor Azan)
      if (!playedToday.fri2 && current === prayTimes.zohor){
        playedToday.fri2 = true;
        console.log("Friday Azan 2 (Zohor)");
        playAudio("normal");
      }
    }

    // -------------------------
    // ASAR / MAGHRIB / ISYAK
    // -------------------------
    if (!playedToday.asar && current === prayTimes.asar){
      playedToday.asar = true;
      playAudio("normal");
    }

    if (!playedToday.maghrib && current === prayTimes.maghrib){
      playedToday.maghrib = true;
      playAudio("normal");
    }

    if (!playedToday.isyak && current === prayTimes.isyak){
      playedToday.isyak = true;
      playAudio("normal");
    }
  }

  // Init
  loadPrayerTimes();
  setInterval(loadPrayerTimes, 5 * 60 * 1000); // Refresh API every 5 mins
  setInterval(tick, 1000); // Check time every second

})();
</script>
<!-- ================= END AZAN 5-WAKTU + FRIDAY AZAN 1 ================= -->

</body>
</html>
