<body>

<!-- Background slideshow -->
<div class="slideshow-bg">
    <img src="bg1.jpg" />
    <img src="bg2.jpg" />
    <img src="bg3.jpg" />
    <img src="bg4.jpg" />
</div>

<div id="app">

    <div class="scroll-area">

        <!-- HEADER -->
        <div class="header-area">
            <div id="dateTodayG">Loading date...</div>
            <div id="dateTodayH">Loading Hijri...</div>
            <div id="zoneName">Loading zone...</div>
        </div>

        <!-- LEFT SIDE -->
        <div class="left-col">

            <div class="row-two">

                <div class="card top-card">
                    <div class="top-inner">
                        <div id="currentPrayerTime" class="big-time">--:--</div>
                        <div id="currentPrayerName" class="small-label">--</div>
                    </div>
                </div>

                <div class="card top-card">
                    <div class="top-inner">
                        <div class="card-title">Waktu Sekarang</div>
                        <div id="currentTime" class="big-time">--:--:--</div>
                    </div>
                </div>

            </div>

            <div class="card menuju-card">
                <div class="card-title">Menuju</div>
                <div id="nextPrayerNameLarge" class="big-next">--</div>
            </div>

            <div class="count-label">Waktu Solat Seterusnya</div>

            <div class="countdown-row">
                <div class="count-box">
                    <div id="cdHour" class="count-num">00</div>
                    <div class="count-text">JAM</div>
                </div>

                <div class="count-box">
                    <div id="cdMin" class="count-num">00</div>
                    <div class="count-text">MINIT</div>
                </div>

                <div class="count-box">
                    <div id="cdSec" class="count-num">00</div>
                    <div class="count-text">SAAT</div>
                </div>
            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="right-col">

            <div class="prayer-row"><span>Imsak</span><span id="imsakTime">--:--</span></div>
            <div class="prayer-row"><span>Subuh</span><span id="subuhTime">--:--</span></div>
            <div class="prayer-row"><span>Syuruk</span><span id="syurukTime">--:--</span></div>
            <div class="prayer-row"><span>Zohor</span><span id="zohorTime">--:--</span></div>
            <div class="prayer-row"><span>Asar</span><span id="asarTime">--:--</span></div>
            <div class="prayer-row"><span>Maghrib</span><span id="maghribTime">--:--</span></div>
            <div class="prayer-row"><span>Isyak</span><span id="isyakTime">--:--</span></div>

        </div>

    </div><!-- END scroll-area -->

</div><!-- END #app -->

<script src="main.js"></script>
</body>
