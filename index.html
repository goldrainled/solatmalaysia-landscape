<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Solat Display — Auto Mode</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Background slideshow -->
<div class="slideshow-bg">
    <img src="bg1.jpg" alt="">
    <img src="bg2.jpg" alt="">
    <img src="bg3.jpg" alt="">
    <img src="bg4.jpg" alt="">
</div>

<div id="viewportHost">
<div id="app" class="app-root">

<div class="scroll-area"><!-- ⭐ FIXED 2-COLUMN 16:9 LAYOUT START -->

    <!-- ==============================
         TOP HEADER (FULL WIDTH)
    =============================== -->
    <div class="header-area">
        <div id="dateTodayG" class="header-row">Loading date...</div>
        <div id="dateTodayH" class="header-row">Loading Hijri...</div>
        <div id="zoneName"  class="header-row location-row">Mengesan lokasi...</div>
    </div>

    <!-- ==============================
         LEFT COLUMN
    =============================== -->
    <div class="left-col">

        <!-- CURRENT PRAYER -->
        <div class="card card-current">
            <div id="currentPrayerName" class="time-label">--</div>
            <div id="currentPrayerTime" class="time-medium">--:--</div>
        </div>

        <!-- CURRENT TIME -->
        <div class="card">
            <div class="card-title">Waktu Sekarang</div>
            <div id="currentTime" class="time-big">--:--:--</div>
        </div>

        <!-- MENUJU -->
        <div class="card">
            <div class="card-title">Menuju</div>
            <div id="nextPrayerNameLarge" class="time-big">--</div>
        </div>

        <!-- COUNTDOWN -->
        <div class="section-title">Waktu Solat Seterusnya</div>

        <div class="countdown-container">
            <div class="count-item">
                <div id="cdHour" class="count-number">00</div>
                <div class="count-text">JAM</div>
            </div>
            <div class="count-item">
                <div id="cdMin" class="count-number">00</div>
                <div class="count-text">MINIT</div>
            </div>
            <div class="count-item">
                <div id="cdSec" class="count-number">00</div>
                <div class="count-text">SAAT</div>
            </div>
        </div>

    </div><!-- left-col -->

    <!-- ==============================
         RIGHT COLUMN (7 PRAYER ROWS)
    =============================== -->
    <div class="right-col">

        <div id="cardIsmak"   class="prayer-row"><span>Imsak</span>  <span id="imsakTime">--:--</span></div>
        <div id="cardSubuh"   class="prayer-row"><span>Subuh</span>  <span id="subuhTime">--:--</span></div>
        <div id="cardSyuruk"  class="prayer-row"><span>Syuruk</span> <span id="syurukTime">--:--</span></div>
        <div id="cardZohor"   class="prayer-row"><span>Zohor</span>  <span id="zohorTime">--:--</span></div>
        <div id="cardAsar"    class="prayer-row"><span>Asar</span>   <span id="asarTime">--:--</span></div>
        <div id="cardMaghrib" class="prayer-row"><span>Maghrib</span><span id="maghribTime">--:--</span></div>
        <div id="cardIsyak"   class="prayer-row"><span>Isyak</span>  <span id="isyakTime">--:--</span></div>

    </div><!-- right-col -->

</div><!-- scroll-area -->

</div><!-- app-root -->
</div><!-- viewportHost -->

<script src="main.js"></script>
</body>
</html>
